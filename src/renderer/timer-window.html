<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
    <title>Timer Window</title>
    <link rel="stylesheet" href="styles/style.css">
    <style>
        body {
            background-color: transparent;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            /* -webkit-app-region: drag; Removed */
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #countdownTimer {
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(100, 100, 100, 0.9);
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            border-radius: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3em;
            color: #ffffff;
            visibility: hidden;
            font-family: monospace;
            font-weight: bold;
            box-sizing: border-box; 
            pointer-events: none; /* Number is transparent to clicks */
        }
        .interaction-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            z-index: 10;
            pointer-events: none;
        }
        #drag-zone {
            flex: 1; /* Top 50% */
            pointer-events: auto;
            -webkit-app-region: drag;
            cursor: move;
            /* background: rgba(255, 0, 0, 0.1); Debug: Red */
        }
        #wheel-zone {
            flex: 1; /* Bottom 50% */
            pointer-events: auto;
            -webkit-app-region: no-drag;
            cursor: zoom-in;
            /* background: rgba(0, 0, 100, 0.1); Debug: Blue */
        }
        #countdownMenu {
            position: absolute;
            width: 100vw;
            margin: 0;
            padding: 0;

            -webkit-app-region: no-drag;
        }
    </style>
</head>
<body>
    <div id="countdownTimer">10</div>
    <div class="interaction-overlay">
        <div id="drag-zone" title="Drag to move"></div>
        <div id="wheel-zone" title="Scroll to resize font"></div>
    </div>
    <div id="countdownMenu" class="countdown-menu">
        <div class="countdown-menu__value">
            <span id="countdownMenuValue">10</span>
        </div>
        <div id="timer-presets-container" class="preset-container">
            <!-- Generated dynamically -->
        </div>
    </div>
    <script src="./timer/timer-style-state.js"></script>
    <script src="./timer-renderer.js"></script>
</body>
</html>
