<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
    <title>Select Display & PPT</title>
    <link rel="stylesheet" href="styles/style.css">
    <style>
        /* main-window 専用のスタイル */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            padding: 20px;
            padding-bottom: 60px;
            background-color: #f4f4f4;
            font-size: 14px;
            box-sizing: border-box;
            min-height: 100vh;
            overflow-y: auto !important;
            height: auto !important;
            width: auto !important;
            user-select: text !important;
        }
        #error-message { color: #dc3545; margin-top: 15px; font-weight: bold; min-height: 1.2em; }
    </style>
</head>
<body id="main-window">
    <div class="section" style="background: #e2f3f5;">
        <!-- Display Section -->
        <div class="sub-section" style="margin-bottom: 6px;">
            <label for="display-select" style="width: 85px;">Cursor Screen:</label>
            <select id="display-select" disabled>
                <option value="">-- Loading Displays --</option>
            </select>
            <button id="cursor-toggle-btn" disabled style="background: #28a745; color: white;">ON</button>
        </div>

        <!-- PPT Section -->
        <div class="sub-section">
            <label for="ppt-select" style="width: 85px;">PPT Target:</label>
            <select id="ppt-select" disabled>
                <option value="">-- Loading Presentations --</option>
            </select>
            <div style="width: 40px; flex-shrink: 0;"></div> <!-- Alignment Spacer -->
        </div>

        <div class="sub-section" style="align-items: center; margin-top: 8px; flex-wrap: wrap; gap: 8px;">
            <label for="pointer-move-speed" style="width: 85px;">Pointer:</label>
            <span style="font-size: 12px; color: #0f5c6e;">Speed</span>
            <input type="range" id="pointer-move-speed" min="0.01" max="0.12" step="0.01" value="0.05" style="width: 120px;">
            <span id="pointer-move-speed-value" style="width: 36px; font-variant-numeric: tabular-nums; color: #0f5c6e;">0.05</span>
            <span style="font-size: 12px; color: #0f5c6e;">Deadzone</span>
            <input type="number" id="pointer-gyro-deadzone" min="0" max="300" step="5" value="120" style="width: 60px;">
            <button id="pointer-settings-reset-btn" style="background: #6c757d; color: white;">Reset</button>
        </div>
    </div>

    <div class="section" style="background: #fff3cd;">
        <div class="sub-section">
            <label>Timer (s):</label>
            <input type="number" id="countdown-initial-value" value="10" min="1" max="3600" style="width: 45px;">
            <div id="preset-buttons-container" style="display: flex; gap: 5px; flex-wrap: wrap;">
                <!-- Generated dynamically -->
            </div>
            <button id="toggle-preset-edit-btn" style="background: #6c757d; color: white;">⚙ Edit Presets</button>
            <button id="toggle-timer-window-btn" style="background: #007bff; color: white;">Show Timer</button>
            <button id="toggle-timer-pause-btn" style="background: #f0ad4e; color: white;">一時停止／再開</button>
            <button id="add-minute-main-btn" style="background: #5cb85c; color: white;">+1分</button>
        </div>

        <div id="preset-edit-container" class="section" style="background: #fff; display: none;">
            <div id="preset-inputs-list" style="margin-bottom: 5px;"></div>
            <div style="display: flex; gap: 5px;">
                <button id="add-preset-config-btn" style="flex: 1; background: #007bff; color: white;">+ Add</button>
                <button id="apply-presets-btn" style="flex: 1; background: #28a745; color: white;">Apply All</button>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 8px;">
            <div class="sub-section">
                <span style="color: #856404; font-weight: bold; width: 32px; flex-shrink: 0; margin: 0;">🎵:</span>
                <button id="sound-folder-select-btn" style="background: #17a2b8; color: white;">Select</button>
                <button id="refresh-sounds-btn" style="background: #6c757d; color: white;">Refresh</button>
                <label style="display: flex; align-items: center; gap: 4px; font-size: 11px; color: #856404;">
                    Delay(ms)
                    <input type="number" id="sound-play-delay" value="200" min="0" max="5000" style="width: 60px;">
                </label>
            </div>
            <div class="sub-section">
                <span style="color: #856404; font-weight: bold; width: 32px; flex-shrink: 0; margin: 0;">🔔1:</span>
                <input type="number" id="sound1-time" value="30" min="0" max="3600" style="width: 45px;">
                <span style="color: #666; width: 10px; flex-shrink: 0; margin: 0;">s</span>
                <select id="sound1-select">
                    <option value="">-- No Audio --</option>
                </select>
                <label style="display: flex; align-items: center; gap: 4px; font-size: 11px; color: #856404;">
                    <input type="checkbox" id="sound1-rumble">
                    振動
                </label>
                <button id="sound1-play-btn" class="sound-play-btn">▶</button>
            </div>
            <div class="sub-section">
                <span style="color: #856404; font-weight: bold; width: 32px; flex-shrink: 0; margin: 0;">🔔2:</span>
                <input type="number" id="sound2-time" value="0" min="0" max="3600" style="width: 45px;">
                <span style="color: #666; width: 10px; flex-shrink: 0; margin: 0;">s</span>
                <select id="sound2-select">
                    <option value="">-- No Audio --</option>
                </select>
                <label style="display: flex; align-items: center; gap: 4px; font-size: 11px; color: #856404;">
                    <input type="checkbox" id="sound2-rumble">
                    振動
                </label>
                <button id="sound2-play-btn" class="sound-play-btn">▶</button>
            </div>
        </div>
    </div>

    <div class="section" style="display: flex; align-items: center; gap: 10px; background: #e2f3f5;">
        <label>Message:</label>
        <div id="message-input" contenteditable="true" 
             style="flex: 1; min-height: 24px; max-height: 100px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; background: white; font-family: inherit; font-size: 13px; overflow-y: auto; white-space: pre-wrap; resize: vertical;"></div>
        <button id="toggle-message-button" style="background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; white-space: nowrap; height: 36px; padding: 0 12px; font-size: 0.9em;">Show/Hide</button>
        
        <div id="color-context-menu" style="display: none; position: fixed; background: white; border: 1px solid #ccc; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); z-index: 1000; padding: 5px; border-radius: 4px; min-width: 120px;">
            <div style="font-size: 11px; color: #666; margin-bottom: 5px; padding: 0 5px;">Format</div>
            <div id="style-options" style="display: flex; gap: 5px; margin-bottom: 8px; padding: 0 5px;">
                <button class="style-btn" data-cmd="bold" style="flex: 1; padding: 2px; font-weight: bold; background: #eee; border: 1px solid #ccc; cursor: pointer;">B</button>
                <button class="style-btn" data-cmd="italic" style="flex: 1; padding: 2px; font-style: italic; background: #eee; border: 1px solid #ccc; cursor: pointer;">I</button>
                <button class="style-btn" data-cmd="strikeThrough" style="flex: 1; padding: 2px; text-decoration: line-through; background: #eee; border: 1px solid #ccc; cursor: pointer;">S</button>
            </div>
            <div style="font-size: 11px; color: #666; margin-bottom: 5px; padding: 0 5px;">Color</div>
            <div id="color-options" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;">
                <div class="color-swatch" data-color="#ffffff" style="width: 20px; height: 20px; background: #ffffff; border: 1px solid #ddd; cursor: pointer;" title="White"></div>
                <div class="color-swatch" data-color="#ff0000" style="width: 20px; height: 20px; background: #ff0000; cursor: pointer;" title="Red"></div>
                <div class="color-swatch" data-color="#00ff00" style="width: 20px; height: 20px; background: #00ff00; cursor: pointer;" title="Green"></div>
                <div class="color-swatch" data-color="#ffff00" style="width: 20px; height: 20px; background: #ffff00; cursor: pointer;" title="Yellow"></div>
                <div class="color-swatch" data-color="#0000ff" style="width: 20px; height: 20px; background: #0000ff; cursor: pointer;" title="Blue"></div>
                <div class="color-swatch" data-color="#ff00ff" style="width: 20px; height: 20px; background: #ff00ff; cursor: pointer;" title="Magenta"></div>
                <div class="color-swatch" data-color="#00ffff" style="width: 20px; height: 20px; background: #00ffff; cursor: pointer;" title="Cyan"></div>
                <div class="color-swatch" data-color="#ffa500" style="width: 20px; height: 20px; background: #ffa500; cursor: pointer;" title="Orange"></div>
            </div>
        </div>
    </div>
    
    <hr>
    <div style="text-align: center; margin-bottom: 10px;">
        <span style="font-size: 1.2em; font-weight: bold;">Timer: </span>
        <span id="main-countdown-display" style="font-size: 1.2em; font-weight: bold; color: #007bff;">--:--</span>
    </div>
    <hr>
    <div id="error-message"></div>
    <div id="main-joycon-status">
        <strong>Joy-Con:</strong>
        <span id="main-status-left-container">
            <span id="main-status-left-text" class="disconnected">L: ⚪</span>
            <span id="main-battery-status-left" class="battery"></span>
            <button id="joycon-left-action-btn" class="action-btn">ON</button>
        </span> |
        <span id="main-status-right-container">
            <span id="main-status-right-text" class="disconnected">R: ⚪</span>
            <span id="main-battery-status-right" class="battery"></span>
            <button id="joycon-right-action-btn" class="action-btn">ON</button>
        </span> |
        <span id="calibration-container" style="display: flex; align-items: center; gap: 5px;">
            <button id="calibrate-button" class="action-btn" style="background-color: #6c757d; color: white;">Calibrate</button>
            <span id="calibration-status" style="max-width: 150px; overflow: hidden; text-overflow: ellipsis;">(flat surface)</span>
        </span>
    </div>

    <script src="main/window-api-access.js"></script>
    <script src="local-storage-store.js"></script>
    <script src="main/state.js"></script>
    <script src="main/main-renderer-access.js"></script>
    <script src="main/display.js"></script>
    <script src="main/pointer-settings.js"></script>
    <script src="main/ppt.js"></script>
    <script src="main/joycon-logic.js"></script>
    <script src="main/joycon.js"></script>
    <script src="api-resolver-utils.js"></script>
    <script src="parse-number-utils.js"></script>
    <script src="file-url-utils.js"></script>
    <script src="number-utils.js"></script>
    <script src="preset-label-utils.js"></script>
    <script src="time-format-utils.js"></script>
    <script src="main/timer-logic.js"></script>
    <script src="main/timer-ui-utils.js"></script>
    <script src="main/timer-sound-handlers.js"></script>
    <script src="main/timer.js"></script>
    <script src="main/message.js"></script>
    <script src="main/init.js"></script>
</body>
</html>
