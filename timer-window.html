<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
    <title>Timer Window</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: transparent;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }
        #countdownTimer {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(100, 100, 100, 0.9);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 3em;
            z-index: 100;
            color: #ffffff;
            visibility: hidden;
            font-family: monospace;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="countdownTimer">10</div>
    <div id="countdownMenu" class="countdown-menu" style="visibility: hidden;">
        <div class="countdown-menu__title">Countdown Setup</div>
        <div class="countdown-menu__value">
            <span id="countdownMenuValue">10</span> sec
        </div>
        <div class="countdown-menu__hint">SR: close  PLUS: +1  MINUS: -1</div>
    </div>
    <script src="./timer-renderer.js"></script>
</body>
</html>
