name: CI

on:
    pull_request:
        branches: ['main']
    push:
        branches: ['main']

jobs:
    test-and-build:
        runs-on: windows-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install Dependencies
              run: npm ci

            - name: Run ESLint Analysis (Strict)
              run: npm run lint:analyze:ci

            - name: Run Tests
              run: npm run test

            - name: Run Build
              run: npm run build
