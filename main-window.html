<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
    <title>Select Display & PPT</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* main-window 専用のスタイル */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            padding: 20px; /* 上左右のパディング */
            padding-bottom: 60px; /* ★ 固定フッター分のスペースを確保 (重要) ★ */
            background-color: #f4f4f4;
            font-size: 14px;
            box-sizing: border-box; /* paddingを含めて計算 */
            min-height: 100vh; /* ウィンドウが縦に短い場合でも高さを確保 */
            overflow-y: auto !important; /* Allow vertical scrolling */
            height: auto !important;
            width: auto !important;
            user-select: text !important; /* Allow selecting text for configuration */
        }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        select { width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 12px 25px; cursor: pointer; border: none; border-radius: 4px; font-size: 14px; transition: background-color 0.2s ease; margin-right: 10px; vertical-align: middle; /* ボタンの縦位置揃え */ }
        #launch-button { background-color: #28a745; color: white; }
        #launch-button:hover { background-color: #218838; }
        #close-button { background-color: #6c757d; color: white; }
        #close-button:hover { background-color: #5a6268; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        #error-message { color: #dc3545; margin-top: 15px; font-weight: bold; min-height: 1.2em; }
        hr { margin-top: 25px; margin-bottom: 15px; border: 0; border-top: 1px solid #ccc; }
        #main-joycon-status {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #e9ecef;
            border-top: 1px solid #ccc;
            padding: 5px 20px;
            box-sizing: border-box;
            font-size: 0.85em;
            color: #333;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            overflow: hidden;
        }
        #main-joycon-status span {
            display: flex;
            align-items: center;
        }
        .running-slideshow { font-weight: bold; color: green; }
        /* style.css の .connected, .disconnected を利用 */
    </style>
</head>
<body>
    <h1>Select Display for Cursor Window</h1>

    <label for="display-select">Target Display:</label>
    <select id="display-select" disabled>
        <option value="">-- Loading Displays --</option>
    </select>

    <div> <button id="launch-button" disabled>Launch Cursor Window</button>
        <button id="close-button" style="display: none;">Close Cursor Window</button>
    </div>

    <hr style="margin: 15px 0;">
    <label for="ppt-select">Target PowerPoint Presentation:</label>
    <select id="ppt-select" disabled>
        <option value="">-- Loading Presentations --</option>
    </select>

    <hr style="margin: 15px 0;">
    <div>
        <label>Gyro Calibration:</label>
        <button id="calibrate-button">Calibrate Joy-Cons</button>
        <span id="calibration-status">(Place Joy-Cons on a flat surface before calibrating)</span>
    </div>
    
    <hr style="margin: 15px 0;">
    <div>
        <label for="countdown-initial-value">Countdown Timer Presets (seconds): 
            <button id="toggle-preset-edit-btn" style="padding: 2px 8px; font-size: 12px; background: #6c757d; color: white; border-radius: 4px; vertical-align: middle; margin-left: 10px;">⚙ Edit Presets</button>
        </label>
        <div id="preset-buttons-container" style="margin-bottom: 10px;">
            <!-- Generated dynamically -->
        </div>
        
        <div id="preset-edit-container" style="background: #e9ecef; padding: 10px; border-radius: 4px; margin-bottom: 15px; display: none;">
            <label style="font-size: 0.8em; color: #666;">Edit Presets:</label>
            <div id="preset-inputs-list">
                 <!-- Generated dynamically -->
            </div>
            <button id="add-preset-config-btn" style="padding: 5px 10px; font-size: 12px; margin-top: 5px; background: #007bff; color: white;">+ Add Preset</button>
            <button id="apply-presets-btn" style="padding: 5px 10px; font-size: 12px; margin-top: 5px; background: #28a745; color: white;">Apply All</button>
        </div>

        <label for="countdown-initial-value">Manual Value (seconds):</label>
        <input type="number" id="countdown-initial-value" value="10" min="1" max="3600" style="width: 100px; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        <span style="font-size: 0.9em; color: #666; margin-left: 10px;">(Click preset to start immediately)</span>

        <div style="margin-top: 10px;">
            <label style="margin-bottom: 4px; font-size: 0.85em;">Notifications (media/):</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <!-- Sound 1 -->
                <div style="background: #fff; padding: 5px; border-radius: 4px; border: 1px solid #ddd;">
                    <div style="font-size: 0.8em; margin-bottom: 2px;">🔔1: <input type="number" id="sound1-time" value="30" min="0" max="3600" style="width: 40px; padding: 1px;">s</div>
                    <div style="display: flex; gap: 3px;">
                        <select id="sound1-select" style="flex: 1; padding: 2px; font-size: 11px; height: 24px;">
                            <option value="">-- No --</option>
                        </select>
                        <button id="sound1-play-btn" style="padding: 0 6px; background: #17a2b8; color: white; margin: 0; height: 24px; font-size: 10px;">▶</button>
                    </div>
                </div>
                <!-- Sound 2 -->
                <div style="background: #fff; padding: 5px; border-radius: 4px; border: 1px solid #ddd;">
                    <div style="font-size: 0.8em; margin-bottom: 2px;">🔔2: <input type="number" id="sound2-time" value="0" min="0" max="3600" style="width: 40px; padding: 1px;">s</div>
                    <div style="display: flex; gap: 3px;">
                        <select id="sound2-select" style="flex: 1; padding: 2px; font-size: 11px; height: 24px;">
                            <option value="">-- No --</option>
                        </select>
                        <button id="sound2-play-btn" style="padding: 0 6px; background: #17a2b8; color: white; margin: 0; height: 24px; font-size: 10px;">▶</button>
                    </div>
                </div>
            </div>
    </div>
    
    <hr style="margin: 15px 0;">
    <div>
        <label>On-Screen Message:</label>
        <div style="display: flex; gap: 10px; position: relative; align-items: flex-start;">
            <div id="message-input" contenteditable="true" 
                 style="flex: 1; min-height: 42px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background: white; font-family: inherit; font-size: 14px; overflow-y: auto; white-space: pre-wrap; resize: vertical;"></div>
            <button id="toggle-message-button" style="background-color: #007bff; color: white; margin-right: 0; white-space: nowrap; height: 42px; padding: 0 15px;">Show/Hide</button>
            
            <!-- Custom Context Menu for Colors & Style -->
            <div id="color-context-menu" style="display: none; position: fixed; background: white; border: 1px solid #ccc; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); z-index: 1000; padding: 5px; border-radius: 4px; min-width: 120px;">
                <div style="font-size: 11px; color: #666; margin-bottom: 5px; padding: 0 5px;">Format</div>
                <div id="style-options" style="display: flex; gap: 5px; margin-bottom: 8px; padding: 0 5px;">
                    <button class="style-btn" data-cmd="bold" style="flex: 1; padding: 2px; font-weight: bold; background: #eee; border: 1px solid #ccc; cursor: pointer;">B</button>
                    <button class="style-btn" data-cmd="italic" style="flex: 1; padding: 2px; font-style: italic; background: #eee; border: 1px solid #ccc; cursor: pointer;">I</button>
                    <button class="style-btn" data-cmd="strikeThrough" style="flex: 1; padding: 2px; text-decoration: line-through; background: #eee; border: 1px solid #ccc; cursor: pointer;">S</button>
                </div>
                <div style="font-size: 11px; color: #666; margin-bottom: 5px; padding: 0 5px;">Text Color</div>
                <div id="color-options" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;">
                    <div class="color-swatch" data-color="#ffffff" style="width: 20px; height: 20px; background: #ffffff; border: 1px solid #ddd; cursor: pointer;" title="White"></div>
                    <div class="color-swatch" data-color="#ff0000" style="width: 20px; height: 20px; background: #ff0000; cursor: pointer;" title="Red"></div>
                    <div class="color-swatch" data-color="#00ff00" style="width: 20px; height: 20px; background: #00ff00; cursor: pointer;" title="Green"></div>
                    <div class="color-swatch" data-color="#ffff00" style="width: 20px; height: 20px; background: #ffff00; cursor: pointer;" title="Yellow"></div>
                    <div class="color-swatch" data-color="#0000ff" style="width: 20px; height: 20px; background: #0000ff; cursor: pointer;" title="Blue"></div>
                    <div class="color-swatch" data-color="#ff00ff" style="width: 20px; height: 20px; background: #ff00ff; cursor: pointer;" title="Magenta"></div>
                    <div class="color-swatch" data-color="#00ffff" style="width: 20px; height: 20px; background: #00ffff; cursor: pointer;" title="Cyan"></div>
                    <div class="color-swatch" data-color="#ffa500" style="width: 20px; height: 20px; background: #ffa500; cursor: pointer;" title="Orange"></div>
                </div>
            </div>
        </div>
    </div>
    
    <hr style="margin-top: 20px;">

    <div id="error-message"></div>

    <hr>
    <div id="main-joycon-status">
        <strong>Joy-Con Status:</strong>
        <span id="main-status-left-container">
            <span id="main-status-left-text" class="disconnected">L: ⚪</span>
            <span id="main-battery-status-left" style="font-size: 0.8em; margin-left: 5px; color: #666;"></span>
            <button id="joycon-left-action-btn" style="padding: 2px 10px; font-size: 11px; margin-left: 5px;">ON</button>
        </span> |
        <span id="main-status-right-container">
            <span id="main-status-right-text" class="disconnected">R: ⚪</span>
            <span id="main-battery-status-right" style="font-size: 0.8em; margin-left: 5px; color: #666;"></span>
            <button id="joycon-right-action-btn" style="padding: 2px 10px; font-size: 11px; margin-left: 5px;">ON</button>
        </span>
    </div>



    <script src="main-renderer.js"></script>
</body>
</html>
