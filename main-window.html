<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
    <title>Select Display & PPT</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* main-window 専用のスタイル */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            padding: 20px; /* 上左右のパディング */
            padding-bottom: 50px; /* ★ 固定フッター分のスペースを確保 (重要) ★ */
            background-color: #f4f4f4;
            font-size: 14px;
            box-sizing: border-box; /* paddingを含めて計算 */
            min-height: 100vh; /* ウィンドウが縦に短い場合でも高さを確保 */
        }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        select { width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 12px 25px; cursor: pointer; border: none; border-radius: 4px; font-size: 14px; transition: background-color 0.2s ease; margin-right: 10px; vertical-align: middle; /* ボタンの縦位置揃え */ }
        #launch-button { background-color: #28a745; color: white; }
        #launch-button:hover { background-color: #218838; }
        #close-button { background-color: #6c757d; color: white; }
        #close-button:hover { background-color: #5a6268; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        #error-message { color: #dc3545; margin-top: 15px; font-weight: bold; min-height: 1.2em; }
        hr { margin-top: 25px; margin-bottom: 15px; border: 0; border-top: 1px solid #ccc; }
        #main-joycon-status {
            position: fixed;   /* ★ 位置を固定 */
            bottom: 0;         /* ★ 下端に配置 */
            left: 0;          /* ★ 左端に配置 */
            width: 100%;       /* ★ 幅を100%に */
            background-color: #e9ecef; /* 背景色で見やすく */
            border-top: 1px solid #ccc; /* 上の境界線 */
            padding: 8px 20px; /* 内側の余白 */
            box-sizing: border-box; /* paddingを含めて幅を計算 */
            font-size: 0.9em;  /* 元のスタイル */
            color: #555;      /* 元のスタイル */
            z-index: 10;       /* 他の要素より手前に表示 (念のため) */
        }
        .running-slideshow { font-weight: bold; color: green; }
        /* style.css の .connected, .disconnected を利用 */
    </style>
</head>
<body>
    <h1>Select Display for Cursor Window</h1>

    <label for="display-select">Target Display:</label>
    <select id="display-select" disabled>
        <option value="">-- Loading Displays --</option>
    </select>

    <div> <button id="launch-button" disabled>Launch Cursor Window</button>
        <button id="close-button" style="display: none;">Close Cursor Window</button>
    </div>

    <hr style="margin: 15px 0;">
    <label for="ppt-select">Target PowerPoint Presentation:</label>
    <select id="ppt-select" disabled>
        <option value="">-- Loading Presentations --</option>
    </select>

    <hr style="margin: 15px 0;">
    <div>
        <label>Gyro Calibration:</label>
        <button id="calibrate-button">Calibrate Joy-Cons</button>
        <span id="calibration-status">(Place Joy-Cons on a flat surface before calibrating)</span>
    </div>
    
    <hr style="margin: 15px 0;">
    <div>
        <label for="countdown-initial-value">Countdown Timer Initial Value (seconds):</label>
        <input type="number" id="countdown-initial-value" value="10" min="1" max="3600" style="width: 100px; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>
    
    <hr style="margin-top: 20px;">

    <div id="error-message"></div>

    <hr>
    <div id="main-joycon-status">
        <strong>Joy-Con Status:</strong>
        <span id="main-status-left" class="disconnected">Left: Disconnected</span> |
        <span id="main-status-right" class="disconnected">Right: Disconnected</span>
    </div>

    <div id="battery-status" style="margin-top: 20px;">
        <h3>Joy-Con バッテリー残量</h3>
        <p>左: <span id="main-battery-status-left">-</span></p>
        <p>右: <span id="main-battery-status-right">-</span></p>
    </div>

    <script src="main-renderer.js"></script>
</body>
</html>
