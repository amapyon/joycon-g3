<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
    <title>Cursor Window</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: rgba(0, 0, 0, 0.1);
            /* opacity: 0.1; */
            color: #c8ccd4;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            /* cursor: none; OSカーソル非表示 */
        }
        #status {
            position: fixed;
            bottom: 10px; /* 少し上に */
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 0.9em;
            z-index: 10;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="cursor1" class="cursor"></div>
    <div id="cursor2" class="cursor"></div>
    <script src="cursor-renderer.js"></script>
</body>
</html>
