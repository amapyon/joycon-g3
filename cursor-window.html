<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
    <title>Cursor Window</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: rgba(0, 0, 0, 0.1);
            /* opacity: 0.1; */
            color: #c8ccd4;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            /* cursor: none; OSカーソル非表示 */
        }
        #status {
            position: fixed;
            bottom: 10px; /* 少し上に */
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 0.9em;
            z-index: 10;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <script>console.log(`[cursor-window.html] Loaded at: ${new Date().toLocaleTimeString()}`);</script>
    <div id="cursorLeft" class="cursor"></div>
    <div id="cursorRight" class="cursor"></div>
    <div id="countdownTimer" style="position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 6px 10px; border-radius: 5px; font-size: 0.9em; z-index: 10; color: #c8ccd4; visibility: hidden;">
        10
    </div>
    <div id="countdownMenu" class="countdown-menu" style="visibility: hidden;">
        <div class="countdown-menu__title">Countdown Setup</div>
        <div class="countdown-menu__value">
            <span id="countdownMenuValue">10</span> sec
        </div>
        <div class="countdown-menu__hint">SR: close  PLUS: +1  MINUS: -1</div>
    </div>
    <script src="./cursor-renderer.js"></script>
</body>
</html>
